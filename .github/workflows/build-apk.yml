# Builds a debug APK on every push to main and uploads it as a downloadable
# artifact — so you can install RippleUp without ever opening Android Studio.
#
# How to get your APK:
#   1. Push this project to a PUBLIC GitHub repo (e.g. rudra496/RippleUpAndroid).
#   2. Open the repo → click the "Actions" tab.
#   3. Click the latest "Build Debug APK" run → scroll to "Artifacts".
#   4. Download "rippleup-debug-apk" → unzip → you get app-debug.apk.
#   5. On your phone: enable "Install unknown apps", then tap the APK to install.
name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # lets you trigger it manually from the Actions tab

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rippleup-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
          if-no-files-found: error
